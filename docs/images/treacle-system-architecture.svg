<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <style>text{font-family:Arial,sans-serif;fill:#1e1e1e}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#555}.head{font-size:19px;font-weight:700}.body{font-size:15px}.note{font-size:16px}</style>
  <rect width="1400" height="980" fill="white"/>
  <text x="80" y="55" class="title">Treacle / Sentry — Real-Time Crypto Dashboard Architecture</text>
  <text x="80" y="85" class="sub">Authentication + SSE live stream + independent REST polling + Zustand state</text>
  <g stroke="#1e1e1e" stroke-width="2" rx="12"><rect x="80" y="140" width="220" height="280" fill="#d0ebff"/><rect x="360" y="140" width="270" height="280" fill="#e5dbff"/><rect x="690" y="140" width="240" height="280" fill="#fff3bf"/><rect x="1040" y="140" width="260" height="280" fill="#d3f9d8"/><rect x="1040" y="510" width="260" height="170" fill="#ffe3e3"/><rect x="720" y="510" width="250" height="170" fill="#ffe8cc"/><rect x="340" y="510" width="320" height="170" fill="#c5f6fa"/><rect x="80" y="510" width="210" height="170" fill="#d3f9d8"/><rect x="80" y="750" width="350" height="160" fill="#fff3bf"/></g>
  <g class="head"><text x="105" y="175">Browser</text><text x="385" y="175">Frontend lifecycle hooks</text><text x="715" y="175">Zustand state</text><text x="1065" y="175">Express API (port 3001)</text><text x="1065" y="545">Session service</text><text x="745" y="545">HttpOnly session cookie</text><text x="365" y="545">Stream service (SSE)</text><text x="105" y="545">Market simulator</text><text x="105" y="785">Summary service</text></g>
  <g class="body"><text x="105" y="205">React + TypeScript / Vite SPA</text><text x="105" y="230">Login · Overview · Analytics</text><text x="105" y="252">Alerts · Settings · Profile</text><text x="105" y="285">Protected dashboard shell</text><text x="105" y="310">API services + EventSource</text><text x="105" y="335">Responsive UI</text>
  <text x="385" y="205">useAppBootstrap: restore session</text><text x="385" y="230">useLiveTelemetry: EventSource</text><text x="385" y="255">useDashboardPolling: REST</text><text x="385" y="280">useSessionExpiry: clear state</text><text x="385" y="305">Every timer/connection cleans up</text>
  <text x="715" y="205">Runtime: session, frames, summary</text><text x="715" y="230">alerts, connection, error</text><text x="715" y="265">Persisted localStorage:</text><text x="715" y="290">theme · interval · paused</text>
  <text x="1065" y="205">/api/auth: login/session/logout</text><text x="1065" y="235">/api/dashboard: stream, summary</text><text x="1065" y="260">alerts + acknowledgement</text><text x="1065" y="300">Session middleware protects routes</text>
  <text x="1065" y="575">Opaque token, 30-min expiry</text><text x="1065" y="600">Credential check + revoke logout</text><text x="1065" y="625">In-memory Map (assessment)</text>
  <text x="745" y="575">SameSite=Strict, HttpOnly</text><text x="745" y="600">Browser sends with REST + SSE</text><text x="745" y="625">Secure when HTTPS enabled</text>
  <text x="365" y="575">Tick every 2 seconds</text><text x="365" y="600">Push latest frame to clients</text><text x="365" y="625">Expired event closes connection</text>
  <text x="105" y="575">BTC · ETH · DOGE</text><text x="105" y="600">price · volume · spread</text><text x="105" y="625">status + event + alert</text><text x="105" y="650">900 frames / 100 alerts</text>
  <text x="105" y="815">Current vs previous 60-second window</text><text x="105" y="842">coin-specific averages + deltas</text><text x="105" y="869">sampled trends every ~10 seconds</text><text x="105" y="894">up to 60 trend points</text></g>
  <g stroke="#1e1e1e" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M300 280H360"/><path d="M630 280H690"/><path d="M930 280H1040"/><path d="M1170 420V510"/><path d="M1040 595H970"/><path d="M340 595H290"/><path d="M185 680L255 750"/></g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1e1e1e"/></marker></defs>
  <text x="500" y="770" class="head">Interview talking points</text><text x="500" y="805" class="note">1. SSE gives low-latency live telemetry for the Overview page.</text><text x="500" y="833" class="note">2. REST polling is independent, so Analytics and Alerts keep refreshing when live updates pause.</text><text x="500" y="861" class="note">3. Session expiry or a 401 clears protected frontend state and stops connections.</text><text x="500" y="889" class="note">4. The assessment intentionally uses in-memory data; production would add a database and real auth.</text>
</svg>
